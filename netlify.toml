# Netlify build and routing for the Urimor Terra site.
# GitHub Pages ignores this file, so the site keeps working on both.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Clean URL for the Mine-to-Value demo: urimor.mn/mine-to-value-demo
# 200 rewrites the path without changing what the address bar shows.
[[redirects]]
  from = "/mine-to-value-demo"
  to = "/mine-to-value-demo.html"
  status = 200

# Alternative, if you would rather serve the prototype itself under your own
# domain instead of framing it. Uncomment this block and comment out the one
# above. Netlify fetches the demo and serves it as urimor.mn/mine-to-value-demo,
# so the github.io address never appears to the visitor.
#
# [[redirects]]
#   from = "/mine-to-value-demo/*"
#   to = "https://iceelyn.github.io/mine-to-value-demo-v1/:splat"
#   status = 200
#   force = true

# Hashed build assets never change contents under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
